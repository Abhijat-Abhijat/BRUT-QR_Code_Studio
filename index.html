<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Awwwards-level minimalist QR code generator tool"
    />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            },
            colors: {
              obsidian: '#09090b',
              surface: '#121216',
              subtle: '#27272a',
            },
          },
        },
      };
    </script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
      integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <title>QR Code Studio — Minimalist Generator</title>
    <style>
      #spinner {
        display: none;
      }
      /* Custom smooth fade and scale utilities */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
  </head>
  <body class="bg-obsidian text-neutral-100 antialiased min-h-screen selection:bg-white selection:text-black flex flex-col justify-between">

    <!-- Header -->
    <header class="w-full border-b border-neutral-800/60 backdrop-blur-md bg-obsidian/80 sticky top-0 z-50">
      <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="w-2.5 h-2.5 rounded-full bg-white animate-pulse"></div>
          <span class="text-xs uppercase tracking-widest font-semibold text-neutral-400">Studio Utility // 01</span>
        </div>
        <div class="text-sm font-medium tracking-tight text-neutral-200">QR Code Matrix</div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-6 py-16 w-full my-auto">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
        
        <!-- Left Column: Form & Narrative -->
        <div class="lg:col-span-7 space-y-8">
          <div class="space-y-3">
            <h1 class="text-4xl sm:text-5xl font-bold tracking-tight text-white">
              Precision QR Generation.
            </h1>
            <p class="text-neutral-400 text-base sm:text-lg max-w-xl font-light leading-relaxed">
              Transform any destination URL into a scannable, high-resolution matrix instantly. Designed with editorial restraint.
            </p>
          </div>

          <form id="generate-form" class="space-y-5 bg-surface p-8 rounded-2xl border border-neutral-800/80 shadow-2xl relative overflow-hidden">
            <div class="absolute -right-16 -top-16 w-48 h-48 bg-white/5 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="space-y-2">
              <label for="url" class="text-xs uppercase tracking-wider font-semibold text-neutral-400">Destination URL</label>
              <input
                id="url"
                type="url"
                placeholder="https://example.com"
                class="w-full bg-obsidian border border-neutral-800 rounded-xl px-4 py-3.5 text-neutral-100 placeholder-neutral-600 focus:outline-none focus:border-neutral-400 focus:ring-1 focus:ring-neutral-400 transition-all text-sm"
              />
            </div>

            <div class="space-y-2">
              <label for="size" class="text-xs uppercase tracking-wider font-semibold text-neutral-400">Matrix Resolution</label>
              <div class="relative">
                <select
                  class="w-full bg-obsidian border border-neutral-800 rounded-xl px-4 py-3.5 text-neutral-100 focus:outline-none focus:border-neutral-400 focus:ring-1 focus:ring-neutral-400 transition-all text-sm appearance-none cursor-pointer"
                  name="size"
                  id="size"
                >
                  <option value="100">100 × 100 px</option>
                  <option value="200">200 × 200 px</option>
                  <option value="300" selected>300 × 300 px (Recommended)</option>
                  <option value="400">400 × 400 px</option>
                  <option value="500">500 × 500 px</option>
                  <option value="600">600 × 600 px</option>
                  <option value="700">700 × 700 px</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-neutral-500">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
              </div>
            </div>

            <button
              class="w-full bg-white text-black font-semibold rounded-xl py-4 px-6 hover:bg-neutral-200 active:scale-[0.99] transition-all text-sm tracking-wide shadow-lg cursor-pointer mt-2"
              type="submit"
            >
              Generate QR Matrix
            </button>
          </form>
        </div>

        <!-- Right Column: Interactive Preview Canvas & Output -->
        <div class="lg:col-span-5 flex flex-col items-center justify-center">
          <div class="w-full bg-surface border border-neutral-800/80 rounded-2xl p-8 min-h-[380px] flex flex-col items-center justify-center relative shadow-2xl">
            <div class="absolute inset-0 bg-[radial-gradient(#27272a_1px,transparent_1px)] [background-size:16px_16px] opacity-20 pointer-events-none rounded-2xl"></div>

            <!-- Initial Placeholder Graphic -->
            <div id="placeholder-graphic" class="text-center space-y-3 z-10">
              <div class="w-16 h-16 rounded-2xl bg-obsidian border border-neutral-800 flex items-center justify-center mx-auto text-neutral-600">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v16m8-8H4"></path></svg>
              </div>
              <p class="text-xs text-neutral-500 tracking-wide uppercase font-medium">Awaiting Input Parameters</p>
            </div>

            <!-- Spinner -->
            <div id="spinner" role="status" class="z-10">
              <svg
                class="inline w-12 h-12 text-neutral-800 animate-spin fill-white"
                viewBox="0 0 100 101"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
                  fill="currentColor"
                />
                <path
                  d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                  fill="currentFill"
                />
              </svg>
              <span class="sr-only">Loading...</span>
            </div>

            <!-- Generated QR Output Box -->
            <div id="generated" class="z-10 flex flex-col items-center justify-center w-full">
              <div id="qrcode" class="p-4 bg-white rounded-xl shadow-inner mb-4 animate-fade-in"></div>
            </div>
          </div>
        </div>

      </div>
    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-neutral-800/60 py-6 text-center text-xs text-neutral-500">
      <p>&copy; 2026 QR Code Studio. All rights reserved.</p>
    </footer>

    <!-- Script Logic -->
    <script>
      const form = document.getElementById('generate-form');
      const qr = document.getElementById('qrcode');
      const placeholder = document.getElementById('placeholder-graphic');

      // Button submit handler
      const onGenerateSubmit = (e) => {
        e.preventDefault();

        clearUI();

        const url = document.getElementById('url').value;
        const size = document.getElementById('size').value;

        // Validate url
        if (url === '') {
          alert('Please enter a valid URL');
        } else {
          placeholder.style.display = 'none';
          showSpinner();
          
          // Simulate brief professional render delay
          setTimeout(() => {
            hideSpinner();
            generateQRCode(url, size);

            // Generate the save button after the qr code image src is ready
            setTimeout(() => {
              const saveUrl = qr.querySelector('img').src;
              createSaveBtn(saveUrl);
            }, 50);
          }, 600);
        }
      };

      // Generate QR code using qrcode.js
      const generateQRCode = (url, size) => {
        new QRCode('qrcode', {
          text: url,
          width: parseInt(size) > 300 ? 300 : parseInt(size), // responsive clamp in view container
          height: parseInt(size) > 300 ? 300 : parseInt(size),
        });
      };

      // Clear QR code and save button
      const clearUI = () => {
        qr.innerHTML = '';
        const saveBtn = document.getElementById('save-link');
        if (saveBtn) {
          saveBtn.remove();
        }
        placeholder.style.display = 'block';
      };

      // Show spinner
      const showSpinner = () => {
        const spinner = document.getElementById('spinner');
        spinner.style.display = 'block';
      };

      // Hide spinner
      const hideSpinner = () => {
        const spinner = document.getElementById('spinner');
        spinner.style.display = 'none';
      };

      // Create save button to download QR code as image
      const createSaveBtn = (saveUrl) => {
        const link = document.createElement('a');
        link.id = 'save-link';
        link.className =
          'w-full bg-neutral-800 hover:bg-neutral-700 text-white font-medium py-3 px-4 rounded-xl text-center text-xs uppercase tracking-wider transition-all animate-fade-in block mt-2 border border-neutral-700';
        link.href = saveUrl;
        link.download = 'qrcode.png';
        link.innerHTML = 'Download Matrix Image';
        document.getElementById('generated').appendChild(link);
      };

      hideSpinner();
      form.addEventListener('submit', onGenerateSubmit);
    </script>
  </body>
</html>
